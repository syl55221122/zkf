name: 球吧数据自动更新

on:
  schedule:
    # 每 15 分钟运行一次（注意：cron 使用 UTC 时间）
    - cron: "*/15 * * * *"
  # 允许在 GitHub Actions 页面手动点一下立即运行
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取比赛数据
        run: python runner.py
        env:
          # 代理池：多个代理用英文逗号分隔。runner 会自动测试并选用
          # 第一个可用的；若全部失效，会自动拉取新的国内代理重试；
          # 若仍无可用则直连尝试。代理选择过程会打印在日志里。
          # 在仓库 Settings → Secrets and variables → Actions 里添加
          # 名为 PROXY_URL 的 secret。只给抓取步骤用，git push 不走代理。
          PROXY_URL: ${{ secrets.PROXY_URL }}

      - name: 提交更新到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 只有数据真正变化时才提交，避免空提交
          git diff --cached --quiet || git commit -m "auto: 更新比赛数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
