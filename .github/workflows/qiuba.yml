name: 球吧数据自动更新

on:
  schedule:
    # 每小时整点运行一次（注意：cron 使用 UTC 时间）
    - cron: "0 * * * *"
  # 允许在 GitHub Actions 页面手动点一下立即运行
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查代理配置
        run: |
          if [ -z "$HTTP_PROXY" ]; then
            echo "RESULT: PROXY 未设置（secret 为空或不存在）"
          else
            echo "RESULT: PROXY 已设置，长度 ${#HTTP_PROXY}"
            code=$(curl -s -o /dev/null -w "%{http_code}" -x "$HTTP_PROXY" --max-time 15 https://www.qiuba001.vip/api/categories)
            echo "RESULT: 经代理访问目标站返回 $code"
          fi
        env:
          HTTP_PROXY: ${{ secrets.PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}

      - name: 抓取比赛数据
        run: python runner.py
        env:
          # 国内出口代理：在仓库 Settings → Secrets and variables → Actions
          # 里添加名为 PROXY_URL 的 secret，值为代理地址
          # （如 http://user:pass@1.2.3.4:8080）。未设置时直连，不影响。
          # 注意：只给抓取步骤加代理，git push 不走代理。
          HTTP_PROXY: ${{ secrets.PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}

      - name: 提交更新到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 只有数据真正变化时才提交，避免空提交
          git diff --cached --quiet || git commit -m "auto: 更新比赛数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
