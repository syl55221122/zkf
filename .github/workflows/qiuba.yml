name: 球吧数据自动更新

on:
  schedule:
    # 每 15 分钟运行一次（注意：cron 使用 UTC 时间）
    - cron: "*/15 * * * *"
  # 允许在 GitHub Actions 页面手动点一下立即运行
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取比赛数据
        # 代理全自动：proxy_harvester.py 每 2 小时实测维护 data/proxies.txt，
        # runner 启动时自动选用可用的，无需任何手动配置。
        run: python runner.py

      - name: 提交更新到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 只有数据真正变化时才提交，避免空提交
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "auto: 更新比赛数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 先提交再合入远端：pull --rebase 要求工作区干净，所以必须在 commit 之后；
            # Coffee Live 每 15 分钟也在提交，rebase 能把我们的提交接到最新远端之后
            git pull --rebase
            # 万一在 pull 和 push 的间隙又有新提交（比如 Coffee Live），重试一次
            git push || { sleep 5; git pull --rebase && git push; }
          fi
