name: ⏱️ 咖啡直播源每10分钟自动更新

on:
  schedule:
    # 国际标准时间(UTC) 每 10 分钟执行一次
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许手动点击触发

# 核心安全设置：必须允许 Action 修改仓库文件并推送
permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 初始化 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: 4. 运行爬虫脚本
      run: python scraper.py

    - name: 5. 将新抓取的直播源推送到 GitHub 仓库
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        # 检查文件是否有变动，避免没有赛事时因空提交而报错
        git add live_list.json live_list.m3u
        if git diff --staged --quiet; then
          echo "直播源数据无变化，跳过本次提交。"
        else
          git commit -m "自动更新直播源时间: $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        fi
