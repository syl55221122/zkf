
name: Coffee Live M3U Auto Refresh

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分钟自动运行一次
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

concurrency:
  group: coffee-live-m3u-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate M3U
        run: python coffee_live.py --output coffee_live.m3u

      
      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add coffee_live.m3u

          if git diff --cached --quiet; then
            echo "M3U 没有变化，无需提交"
          else
            git commit -m "Auto update coffee_live.m3u"
            git push
          fi
