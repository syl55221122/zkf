
name: LiveLeagues M3U8 Auto Refresh

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liveleagues-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan public LiveLeagues pages
        run: python -u liveleagues.py

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liveleagues-scan-report
          path: liveleagues.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- liveleagues.m3u liveleagues.json

          if git diff --cached --quiet; then
            echo "没有文件变化，跳过提交"
          else
            git commit -m "Auto update LiveLeagues playlist and report"
            git push
          fi
