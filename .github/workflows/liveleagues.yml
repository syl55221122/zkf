name: Update Live Streams

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动运行一次
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/tools/python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        # 安装 Playwright 所需的 Chromium 浏览器内核及其系统依赖环境
        playwright install chromium --with-deps

    - name: Run Playwright Scraper
      env:
        LIVELEAGUES_OUTPUT: "liveleagues.m3u"
      run: |
        python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        # 修正：将原先错误的 liveleagues.json 改回 liveleagues.m3u
        git add liveleagues.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update liveleagues.m3u playlist [skip ci]" && git push)
